global:
  scrape_interval: 5s

scrape_configs:

  - job_name: prometheus

    static_configs:

      - targets:
          - prometheus:9090

  - job_name: node

    static_configs:

      - targets:
          - node-exporter:9100

  - job_name: telegraf

    static_configs:

      - targets:
          - telegraf:9273
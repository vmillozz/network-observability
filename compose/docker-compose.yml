services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: observability
    ports:
      - "5432:5432"
    volumes:
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U admin -d observability
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - default

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - netem-router
    volumes:
      - ../telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "9273:9273"
    networks:
      - default
      - client-net

  netem-client:
    build:
      context: ../netem/client
    image: local/netem-node:arm64
    container_name: netem-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - sh
      - -c
      - |
        ip route replace 10.10.2.0/24 via 10.10.1.254
        sleep infinity
    networks:
      client-net:
        ipv4_address: 10.10.1.10

  netem-router:
    build:
      context: ../netem/client
    image: local/netem-node:arm64
    container_name: netem-router
    restart: unless-stopped
    privileged: true
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ../logs:/logs
    command:
      - sh
      - -c
      - |
        touch /logs/router.log
        snmpd -f -Lo 2>&1 | tee -a /logs/router.log
    networks:
      client-net:
        ipv4_address: 10.10.1.254
      server-net:
        ipv4_address: 10.10.2.254

  netem-server:
    build:
      context: ../netem/client
    image: local/netem-node:arm64
    container_name: netem-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - sh
      - -c
      - |
        ip route replace 10.10.1.0/24 via 10.10.2.254
        python3 -m http.server 8080
    networks:
      server-net:
        ipv4_address: 10.10.2.10

  vector:
    image: timberio/vector:0.57.0-alpine
    container_name: vector
    restart: unless-stopped
    volumes:
      - ../vector/vector.toml:/etc/vector/vector.toml:ro
      - ../logs:/logs:ro
      - vector-data:/var/lib/vector
    command:
      - --config
      - /etc/vector/vector.toml
    ports:
      - "5140:5140/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      netem-router:
        condition: service_started
    networks:
      - default
      - client-net

networks:
  default:
    name: observability-net

  client-net:
    name: netem-client-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24

  server-net:
    name: netem-server-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  vector-data:
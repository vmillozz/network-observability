[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  skip_processors_after_aggregators = false

###############################################################################
# Metriche locali del collector
###############################################################################

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]

[[inputs.net]]

###############################################################################
# SNMP Router
###############################################################################

[[inputs.snmp]]
  agents = ["udp://10.10.1.254:161"]
  version = 2
  community = "public"
  name = "router"
  agent_host_tag = "source"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "1.3.6.1.2.1.1.3.0"

###############################################################################
# Esportazione verso Prometheus
###############################################################################

[[outputs.prometheus_client]]
  listen = ":9273"